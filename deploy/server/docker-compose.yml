# Kotilo palvelimella: alusta ja kotisivu saman Caddy-välityspalvelimen takana.
# Caddy hakee ja uusii HTTPS-varmenteet itse (Let's Encrypt).
# Käynnistys tehdään skriptillä remote-deploy.sh, joka antaa projektille nimen "kotilo".
services:
  kotilo:
    build:
      context: ../..
    restart: unless-stopped
    # Asetukset ja salaisuudet ovat palvelimella sovelluskansion ulkopuolella, jotta päivitys ei koske niihin.
    env_file: /opt/kotilo/.env
    volumes:
      # Tietokanta, liitteet ja tietopankin tiedostot.
      - kotilo-data:/data
      # Päivittäiset varmuuskopiot palvelimen levylle, josta ne voi kopioida muualle.
      - /opt/kotilo/varmuuskopiot:/backups
      # Gmailin OAuth-clientin tiedosto (credentials.json).
      - /opt/kotilo/config:/config:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - kotilo
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Kotisivu repon kansiosta site.
      - ../../site:/srv/site:ro
      # Varmenteet säilyvät uudelleenkäynnistysten yli.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  kotilo-data:
  caddy-data:
  caddy-config:
