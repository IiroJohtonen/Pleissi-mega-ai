# Pleissi Mega AI samalla palvelimella Kotilon tuotantoversion kanssa, osoitteessa test2.kotilo.io.
# Käynnistys tehdään skriptillä remote-deploy.sh, joka antaa projektille nimen "pleissi-ai". Nimi ja kansio
# /opt/pleissi-ai erottavat asennuksen Kotilosta (/opt/kotilo, projekti "kotilo"), ja tietokanta on oma.
#
# Omaa Caddya ei ole: portit 80 ja 443 ovat Kotilon Caddyn. Palvelu liittyy Kotilon verkkoon
# (kotilo_default) nimellä pleissi-ai, ja Kotilon Caddyfile ohjaa test2.kotilo.io:n sille. Palvelun nimi ei
# saa olla "kotilo", koska silloin Kotilon Caddy voisi ohjata app.kotilo.io:n liikenteen Mega AI:lle.
services:
  pleissi-ai:
    build:
      context: ../..
    restart: unless-stopped
    # Asetukset ja salaisuudet ovat palvelimella sovelluskansion ulkopuolella, jotta päivitys ei koske niihin.
    env_file: /opt/pleissi-ai/.env
    volumes:
      # Tietokanta, liitteet ja tietopankin tiedostot.
      - pleissi-ai-data:/data
      # Päivittäiset varmuuskopiot palvelimen levylle, josta ne voi kopioida muualle.
      - /opt/pleissi-ai/varmuuskopiot:/backups
      # Gmailin OAuth-clientin tiedosto (credentials.json).
      - /opt/pleissi-ai/config:/config:ro
    networks:
      - kotilo

networks:
  kotilo:
    name: kotilo_default
    external: true

volumes:
  pleissi-ai-data:
